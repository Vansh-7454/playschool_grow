<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Clean background tone -->
  <rect width="800" height="600" fill="#FFFDF9" />
  <rect x="16" y="16" width="768" height="568" rx="20" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="2" />

  <!-- Atmospheric Vector Scene -->
  
      <g transform="translate(100, 40) scale(1.05)">
        <rect x="40" y="40" width="560" height="420" rx="16" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="3" />
        <!-- Wooden sorting tray -->
        <rect x="80" y="70" width="480" height="290" rx="16" fill="#EFE6D8" stroke="#28584E" stroke-width="3" />
        <line x1="320" y1="70" x2="320" y2="360" stroke="#28584E" stroke-width="3" />
        <line x1="80" y1="210" x2="560" y2="210" stroke="#28584E" stroke-width="3" />
        <!-- Geometric shapes inside quadrants -->
        <circle cx="200" cy="140" r="35" fill="#28584E" />
        <rect x="410" y="110" width="60" height="60" rx="8" fill="#C25E2E" />
        <polygon points="200,250 240,320 160,320" fill="#C25E2E" />
        <ellipse cx="440" cy="285" rx="40" ry="25" fill="#28584E" />
      </g>
    

  <!-- Lower Branding and Atmosphere Overlay Strip -->
  <rect x="32" y="504" width="736" height="68" rx="12" fill="#192A25" opacity="0.95" />
  <text x="52" y="532" fill="#F6F4EE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Montessori Sensory Zone</text>
  <text x="52" y="554" fill="#9EB3AC" font-family="'Inter', system-ui, sans-serif" font-size="11.5">Natural wooden sorting trays and kinetic tactile exploration</text>
  <rect x="610" y="516" width="140" height="26" rx="13" fill="#28584E" />
  <text x="680" y="533" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Sensory Learning</text>
</svg>