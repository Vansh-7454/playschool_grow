<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Clean background tone -->
  <rect width="800" height="600" fill="#FFFDF9" />
  <rect x="16" y="16" width="768" height="568" rx="20" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="2" />

  <!-- Atmospheric Vector Scene -->
  
      <g transform="translate(100, 60) scale(1.15)">
        <rect x="40" y="60" width="480" height="380" rx="16" fill="#FFFDF9" stroke="#E5DDD0" stroke-width="3" />
        <!-- Green artificial turf floor -->
        <rect x="40" y="280" width="480" height="160" rx="12" fill="#4E7E73" opacity="0.3" />
        <!-- Mini playground slide -->
        <path d="M120 340 L260 160 L380 340" stroke="#28584E" stroke-width="12" stroke-linecap="round" fill="none" />
        <path d="M260 160 L420 320" stroke="#C25E2E" stroke-width="14" stroke-linecap="round" fill="none" />
        <circle cx="180" cy="120" r="26" fill="#F4D35E" opacity="0.8" />
      </g>
    

  <!-- Lower Branding and Atmosphere Overlay Strip -->
  <rect x="32" y="504" width="736" height="68" rx="12" fill="#192A25" opacity="0.95" />
  <text x="52" y="532" fill="#F6F4EE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Outdoor Safe Play Yard</text>
  <text x="52" y="554" fill="#9EB3AC" font-family="'Inter', system-ui, sans-serif" font-size="11.5">Artificial grass lawn, mini slide and soft obstacle play</text>
  <rect x="610" y="516" width="140" height="26" rx="13" fill="#28584E" />
  <text x="680" y="533" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Gross Motor Play</text>
</svg>