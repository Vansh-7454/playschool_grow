<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Clean background tone -->
  <rect width="800" height="600" fill="#FFFDF9" />
  <rect x="16" y="16" width="768" height="568" rx="20" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="2" />

  <!-- Atmospheric Vector Scene -->
  
      <g transform="translate(120, 80) scale(1.1)">
        <rect x="60" y="140" width="440" height="280" rx="16" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="3" />
        <!-- Soft stacking rings -->
        <ellipse cx="280" cy="340" rx="110" ry="30" fill="#28584E" />
        <ellipse cx="280" cy="305" rx="90" ry="25" fill="#C25E2E" />
        <ellipse cx="280" cy="275" rx="70" ry="20" fill="#4E7E73" />
        <ellipse cx="280" cy="250" rx="50" ry="16" fill="#F4D35E" />
        <ellipse cx="280" cy="225" rx="30" ry="12" fill="#EFE6D8" />
        <circle cx="280" cy="195" r="18" fill="#C25E2E" />
      </g>
    

  <!-- Lower Branding and Atmosphere Overlay Strip -->
  <rect x="32" y="504" width="736" height="68" rx="12" fill="#192A25" opacity="0.95" />
  <text x="52" y="532" fill="#F6F4EE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Playgroup Corner</text>
  <text x="52" y="554" fill="#9EB3AC" font-family="'Inter', system-ui, sans-serif" font-size="11.5">Tactile discovery, soft blocks and sensory water-sand play</text>
  <rect x="610" y="516" width="140" height="26" rx="13" fill="#28584E" />
  <text x="680" y="533" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Ages 2.0 – 3.0</text>
</svg>