<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 1800" width="3200" height="1800" fill="none">
  <!-- Clean background tone -->
  <rect width="3200" height="1800" fill="#FFFDF9" />
  <rect x="16" y="16" width="3168" height="1768" rx="20" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="2" />

  <!-- Atmospheric Vector Scene -->
  
      <!-- Educational balance and study apparatus -->
      <g transform="translate(180, 80) scale(1.3)">
        <rect x="40" y="180" width="560" height="20" rx="6" fill="#EFE6D8" stroke="#E5DDD0" stroke-width="2" />
        <!-- Stacked blocks -->
        <rect x="80" y="100" width="70" height="80" rx="6" fill="#28584E" />
        <text x="115" y="150" fill="#FFFFFF" font-size="34" font-weight="bold" text-anchor="middle">A</text>
        <rect x="160" y="100" width="70" height="80" rx="6" fill="#C25E2E" />
        <text x="195" y="150" fill="#FFFFFF" font-size="34" font-weight="bold" text-anchor="middle">B</text>
        <rect x="240" y="100" width="70" height="80" rx="6" fill="#4E7E73" />
        <text x="275" y="150" fill="#FFFFFF" font-size="34" font-weight="bold" text-anchor="middle">C</text>

        <!-- Counting beads -->
        <circle cx="370" cy="140" r="16" fill="#C25E2E" />
        <circle cx="410" cy="140" r="16" fill="#28584E" />
        <circle cx="450" cy="140" r="16" fill="#F4D35E" />
        <circle cx="490" cy="140" r="16" fill="#4E7E73" />
      </g>
    

  <!-- Lower Branding and Atmosphere Overlay Strip -->
  <rect x="32" y="1704" width="3136" height="68" rx="12" fill="#192A25" opacity="0.95" />
  <text x="52" y="1732" fill="#F6F4EE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Guided Early Childhood Programmes</text>
  <text x="52" y="1754" fill="#9EB3AC" font-family="'Inter', system-ui, sans-serif" font-size="11.5">Playgroup, Nursery and Kindergarten curriculum in Lucknow</text>
  <rect x="3010" y="1716" width="140" height="26" rx="13" fill="#28584E" />
  <text x="3080" y="1733" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Ages 2.0 to 5.0+ Years</text>
</svg>