<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Clean background tone -->
  <rect width="800" height="600" fill="#FFFDF9" />
  <rect x="16" y="16" width="768" height="568" rx="20" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="2" />

  <!-- Atmospheric Vector Scene -->
  
      <g transform="translate(120, 80) scale(1.1)">
        <rect x="40" y="120" width="480" height="280" rx="16" fill="#FFFDF9" stroke="#E5DDD0" stroke-width="3" />
        <ellipse cx="280" cy="280" rx="180" ry="50" fill="#F7F2E9" stroke="#28584E" stroke-width="2" />
        <!-- Plates and cups -->
        <circle cx="180" cy="270" r="30" fill="#EFE6D8" stroke="#C25E2E" stroke-width="2" />
        <circle cx="280" cy="270" r="30" fill="#EFE6D8" stroke="#28584E" stroke-width="2" />
        <circle cx="380" cy="270" r="30" fill="#EFE6D8" stroke="#C25E2E" stroke-width="2" />
        <rect x="135" y="255" width="10" height="30" rx="2" fill="#28584E" />
        <rect x="235" y="255" width="10" height="30" rx="2" fill="#C25E2E" />
      </g>
    

  <!-- Lower Branding and Atmosphere Overlay Strip -->
  <rect x="32" y="504" width="736" height="68" rx="12" fill="#192A25" opacity="0.95" />
  <text x="52" y="532" fill="#F6F4EE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Nutrition and Hydration Schedule</text>
  <text x="52" y="554" fill="#9EB3AC" font-family="'Inter', system-ui, sans-serif" font-size="11.5">Child-height sanitized dining tables with hygienic assistance</text>
  <rect x="610" y="516" width="140" height="26" rx="13" fill="#28584E" />
  <text x="680" y="533" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Healthy Habits</text>
</svg>