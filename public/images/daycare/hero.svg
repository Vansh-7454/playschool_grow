  <text x="52" y="1732" fill="#F6F4EE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Supervised Afternoon Care</text>
  <text x="52" y="1754" fill="#9EB3AC" font-family="'Inter', system-ui, sans-serif" font-size="11.5">Individualized sanitized cots, warm meals and restful routine</text>
