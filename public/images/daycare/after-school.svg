<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Clean background tone -->
  <rect width="800" height="600" fill="#FFFDF9" />
  <rect x="16" y="16" width="768" height="568" rx="20" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="2" />

  <!-- Atmospheric Vector Scene -->
  
      <g transform="translate(100, 70) scale(1.15)">
        <rect x="40" y="100" width="460" height="300" rx="16" fill="#F7F2E9" stroke="#E5DDD0" stroke-width="3" />
        <!-- Jigsaw puzzle tiles -->
        <rect x="180" y="180" width="60" height="60" rx="8" fill="#28584E" />
        <rect x="245" y="180" width="60" height="60" rx="8" fill="#C25E2E" />
        <rect x="180" y="245" width="60" height="60" rx="8" fill="#4E7E73" />
        <rect x="245" y="245" width="60" height="60" rx="8" fill="#F4D35E" />
      </g>
    

  <!-- Lower Branding and Atmosphere Overlay Strip -->
  <rect x="32" y="504" width="736" height="68" rx="12" fill="#192A25" opacity="0.95" />
  <text x="52" y="532" fill="#F6F4EE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Quiet Afternoon Recreation</text>
  <text x="52" y="554" fill="#9EB3AC" font-family="'Inter', system-ui, sans-serif" font-size="11.5">Story reading, floor puzzles, and supervised relaxation</text>
  <rect x="610" y="516" width="140" height="26" rx="13" fill="#28584E" />
  <text x="680" y="533" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Post-School Care</text>
</svg>